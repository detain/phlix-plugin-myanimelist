name: Dispatch

on:
  push:
    branches: [main, master]
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-26.04
    steps:
      - name: Dispatch to phlix-plugins catalog
        env:
          GH_TOKEN: ${{ secrets.PHLIX_BOT_TOKEN }}
          # The workflow context is passed to the shell through environment
          # variables instead of being interpolated into the script text:
          # a branch name is free-form text, and inlining `${{ }}` values on
          # a shell line turns it into a command-injection surface.
          PHLIX_REF: ${{ github.ref }}
          PHLIX_SHA: ${{ github.sha }}
          PHLIX_REPO: ${{ github.repository }}
        run: |
          gh api repos/detain/phlix-plugins/dispatches \
            --field event_type=plugin-push \
            --field "client_payload[ref]=$PHLIX_REF" \
            --field "client_payload[sha]=$PHLIX_SHA" \
            --field "client_payload[repo]=$PHLIX_REPO"
